<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSC - Bittensor Subnet Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        glass: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ── Dark mode (default) ── */
        :root {
            --bg-from: #09090b;
            --bg-to: #171717;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
            --card-shadow: rgba(0,0,0,0.1);
            --header-bg: transparent;
        }

        /* ── Light mode ── */
        html.light {
            --bg-from: #e2e8f0;
            --bg-to: #f1f5f9;
            --text-primary: #0f172a;
            --text-muted: #475569;
            --glass-bg: rgba(255,255,255,0.75);
            --glass-border: rgba(0,0,0,0.08);
            --card-shadow: rgba(0,0,0,0.06);
            --header-bg: rgba(255,255,255,0.6);
        }

        body {
            background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            box-shadow: 0 4px 30px var(--card-shadow);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* Light mode overrides for Tailwind text utilities */
        html.light .text-white { color: #0f172a !important; }
        html.light .text-slate-400 { color: #475569 !important; }
        html.light .text-slate-300 { color: #334155 !important; }
        html.light .text-slate-500 { color: #64748b !important; }
        html.light .bg-white\/5 { background-color: rgba(0,0,0,0.04) !important; }
        html.light .bg-white\/10 { background-color: rgba(0,0,0,0.07) !important; }
        html.light .bg-white\/20 { background-color: rgba(0,0,0,0.10) !important; }
        html.light .border-white\/5 { border-color: rgba(0,0,0,0.07) !important; }
        html.light .border-white\/10 { border-color: rgba(0,0,0,0.10) !important; }
        html.light .border-white\/20 { border-color: rgba(0,0,0,0.15) !important; }
        html.light .bg-black\/30 { background-color: rgba(0,0,0,0.06) !important; }
        html.light .bg-black\/40 { background-color: rgba(0,0,0,0.08) !important; }
        html.light .text-white\/30 { color: rgba(15,23,42,0.5) !important; }
        html.light .text-white\/60 { color: rgba(15,23,42,0.7) !important; }
        html.light .border-slate-700\/50 { border-color: rgba(0,0,0,0.12) !important; }
        html.light .bg-slate-800\/80 { background-color: rgba(0,0,0,0.06) !important; }
        html.light .bg-slate-600 { background-color: #94a3b8 !important; }
        html.light .border-slate-600 { border-color: #94a3b8 !important; }
        html.light .text-slate-300\/90 { color: #334155 !important; }

        .glow-green { box-shadow: 0 0 12px #10b981, 0 0 24px #10b981; }
        .glow-yellow { box-shadow: 0 0 12px #f59e0b, 0 0 24px #f59e0b; }
        .glow-red   { box-shadow: 0 0 12px #ef4444, 0 0 24px #ef4444; }

        /* Theme toggle button */
        #theme-toggle {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        #theme-toggle:hover { transform: scale(1.12); opacity: 0.9; }

        .min-touch { min-height: 44px; min-width: 44px; }
    </style>

    <script>
        // Apply saved theme immediately (before paint) to avoid flash
        (function() {
            const saved = localStorage.getItem('cockpit_theme');
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>

<body class="p-4 md:p-8 lg:p-12">
    <header class="mb-8 flex justify-between items-center max-w-screen-2xl mx-auto">
        <a href="/" class="block min-touch flex items-center">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 tracking-tight">
                    Subnet Cockpit
                </h1>
                <p class="text-sm text-slate-400 mt-1 font-medium bg-white/5 inline-block px-3 py-1 rounded-full">
                    Bittensor Network Intelligence</p>
            </div>
        </a>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle" onclick="toggleTheme()"
            class="flex items-center gap-2 px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-sm font-medium text-slate-300 hover:bg-white/10 transition-all"
            title="Basculer mode clair / sombre">
            <span id="theme-icon">🌙</span>
            <span id="theme-label" class="hidden sm:inline">Sombre</span>
        </button>
    </header>

    <main class="max-w-screen-2xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.toggle('dark', !isDark);
            html.classList.toggle('light', isDark);
            localStorage.setItem('cockpit_theme', isDark ? 'light' : 'dark');
            updateThemeButton();
        }

        function updateThemeButton() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon').textContent  = isDark ? '🌙' : '☀️';
            document.getElementById('theme-label').textContent = isDark ? 'Sombre' : 'Clair';
        }

        // Sync button label on load
        updateThemeButton();
    </script>
</body>

</html>
